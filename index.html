<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mons Novera</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f1ea;color:#222}
header{padding:22px 28px 10px;max-width:1200px;margin:auto}
h1{margin:0 0 6px;font-size:28px}.subtitle{margin:0;color:#555}
main{max-width:1200px;margin:auto;padding:18px 28px 35px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}
.banner{grid-column:1 / -1;overflow:hidden;border-radius:14px;background:#dff1fa;box-shadow:0 2px 12px #00000012;line-height:0}
.banner img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;object-position:center}

/* Galerie für gespeicherte Welten */
.galleryWrap{grid-column:1 / -1;display:none;background:white;border-radius:14px;padding:18px;box-shadow:0 2px 12px #00000012}
.galleryWrap.active{display:block}
.galleryTitle{font-size:16px;margin:0 0 12px;font-weight:700}
.galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.thumbCard{border:2px solid #222;border-radius:8px;overflow:hidden;background:#dff1fa;box-shadow:0 2px 6px #00000010;transition:transform .15s ease;display:flex;flex-direction:column;justify-content:space-between}
.thumbCard:hover{transform:scale(1.03)}
.thumbCard a{display:block;cursor:pointer;flex:1;text-decoration:none;color:inherit}
.thumbCard img{width:100%;height:auto;display:block;object-fit:contain}
.thumbLabel{padding:4px 6px;font-size:12px;font-weight:bold;background:#fff;border-bottom:1px solid #ddd;text-align:center}
.deleteBtn{border:none;background:#e76f51;color:white;padding:6px;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .2s}
.deleteBtn:hover{background:#c0392b}

.panel{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 12px #00000012}
#islandWrap{display:flex;justify-content:center;align-items:center;min-height:520px;overflow:hidden;background:#dff1fa;border-radius:10px;padding:20px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:none;cursor:crosshair;background:#dff1fa;max-width:100%;height:auto;display:block;touch-action:manipulation}
h2{font-size:18px;margin:4px 0 12px}
.info{background:#f4f1ea;border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.4;margin-bottom:16px}
.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.colorCard{display:grid;gap:6px}
.swatch{width:100%;height:48px;border:3px solid transparent;border-radius:9px;cursor:pointer;padding:0;position:relative}
.swatch.selected{border-color:#111;outline:2px solid white}
.swatch span{position:absolute;bottom:2px;left:4px;right:4px;background:#ffffffbb;font-size:11px;border-radius:4px}
.colorPicker{width:100%;height:30px;padding:0;border:1px solid #bbb;border-radius:6px}
.nameInput{width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;font-size:14px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
button.action{border:0;padding:10px 13px;border-radius:8px;cursor:pointer;background:#222;color:white;font-weight:600;flex:1 1 auto;text-align:center}
button.secondary{background:#e8e5de;color:#222}
.stats{font-size:13px;margin-top:14px}.stat{display:flex;justify-content:space-between;padding:3px 0}
@media(max-width:900px){
  header{padding:16px 20px 8px}
  main{grid-template-columns:1fr;padding:14px 20px 28px;gap:16px}
  #islandWrap{min-height:auto;padding:12px}
  .banner img{max-height:none}
}
@media(max-width:480px){
  header{padding:12px 14px 6px}
  h1{font-size:22px}
  main{padding:10px 14px 20px}
  .panel{padding:14px}
  .palette{grid-template-columns:1fr}
  .buttons{flex-direction:column}
  button.action{width:100%}
  .galleryGrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
</style>
</head>
<body>
<header>
<h1>Mons Novera</h1>
<p class="subtitle">Was brauchst du um hier gut leben zu können?</p>
</header>

<main>
<div class="banner">
  <img src="mons-novera-banner.png" alt="Pixel-Art einer fliegenden Insel">
</div>

<section class="galleryWrap" id="galleryWrap">
  <h2 class="galleryTitle">Gespeicherte Welten</h2>
  <div class="galleryGrid" id="galleryGrid"></div>
</section>

<section class="panel">
<div id="islandWrap"><canvas id="canvas"></canvas></div>
</section>

<aside class="panel">
<div class="info"><strong>So geht's:</strong><br>
Wähle eine Farbe, bestimme ihre Bedeutung und klicke anschliessend auf die Pixel der Welt.<br>
Du musst nicht alle zehn Farben verwenden.
</div>

<h2>Farben und Bedeutungen</h2>
<div class="palette" id="palette"></div>

<div class="buttons">
<button class="action secondary" id="reset">Welt zurücksetzen</button>
<button class="action" id="save">Welt speichern</button>
</div>

<div class="stats" id="stats"></div>
</aside>
</main>

<script>
(function(){
"use strict";

const STORAGE_KEY = "mons_novera_saved_worlds";
const VALID_SLOTS = ["1", "2", "3"];
const COLS=20, ROWS=15, SCALE=32;
const defaultColors=["#5DB7DE","#75C56B","#F4C84A","#E76F51","#B58AD8","#E78AB3","#8A9A9B","#F3F0E8","#D98B5F","#5E8FA8"];
let colors=[...defaultColors];
const colorNames=Array(colors.length).fill("");
let selected=0;

const mask=[];
for(let y=0;y<ROWS;y++){
  mask[y]=[];
  for(let x=0;x<COLS;x++){
    const dx=(x-(COLS-1)/2)/9.5;
    const dy=(y-(ROWS-1)/2)/6;
    const edge=dx*dx+dy*dy;
    const irregular=0.10*Math.sin(x*0.9)+0.06*Math.cos(y*1.3);
    mask[y][x]=edge<0.92+irregular;
  }
}

function emptyGrid(){
  return Array.from({length:ROWS},(_,y)=>
    Array.from({length:COLS},(_,x)=>mask[y][x]?7:-1)
  );
}
let grid=emptyGrid();

const canvas=document.getElementById("canvas");
canvas.width=COLS*SCALE;
canvas.height=ROWS*SCALE;
const ctx=canvas.getContext("2d");

function getSavedWorlds() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch(e) {
    return [];
  }
}

function saveSavedWorlds(worlds) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(worlds));
}

function getURLParam(name) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(name);
}

function setWorldURL(id) {
  if (id) {
    const newUrl = window.location.pathname + '?world=' + id;
    window.history.pushState({ worldId: id }, '', newUrl);
  } else {
    window.history.pushState({}, '', window.location.pathname);
  }
}

function loadWorldData(world) {
  grid = JSON.parse(JSON.stringify(world.grid));
  if (world.colors) {
    for (let i = 0; i < colors.length; i++) {
      if (world.colors[i]) colors[i] = world.colors[i];
    }
  }
  if (world.colorNames) {
    for (let i = 0; i < colorNames.length; i++) {
      colorNames[i] = world.colorNames[i] || "";
    }
  }
  makePalette();
  draw();
}

function deleteWorld(id) {
  let worlds = getSavedWorlds();
  worlds = worlds.filter(w => w.id !== id);
  saveSavedWorlds(worlds);
  renderGallery();

  if (getURLParam("world") === id) {
    setWorldURL(null);
    grid = emptyGrid();
    colors = [...defaultColors];
    colorNames.fill("");
    makePalette();
    draw();
  }
}

function renderGallery() {
  const galleryWrap = document.getElementById("galleryWrap");
  const galleryGrid = document.getElementById("galleryGrid");
  galleryGrid.innerHTML = "";

  const worlds = getSavedWorlds();
  worlds.sort((a,b) => Number(a.id) - Number(b.id));

  if (worlds.length > 0) {
    galleryWrap.classList.add("active");
  } else {
    galleryWrap.classList.remove("active");
  }

  worlds.forEach(world => {
    const thumbCard = document.createElement("div");
    thumbCard.className = "thumbCard";

    const label = document.createElement("div");
    label.className = "thumbLabel";
    label.textContent = "Welt " + world.id;
    thumbCard.appendChild(label);

    const link = document.createElement("a");
    link.title = "Welt " + world.id + " laden";
    link.onclick = (e) => {
      e.preventDefault();
      loadWorldData(world);
      setWorldURL(world.id);
    };

    const img = document.createElement("img");
    img.src = world.dataUrl;
    img.alt = "Gespeicherte Welt " + world.id;

    link.appendChild(img);
    thumbCard.appendChild(link);

    const delBtn = document.createElement("button");
    delBtn.className = "deleteBtn";
    delBtn.textContent = "Löschen";
    delBtn.title = "Welt " + world.id + " löschen";
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteWorld(world.id);
    };

    thumbCard.appendChild(delBtn);
    galleryGrid.appendChild(thumbCard);
  });
}

function draw(){
  ctx.fillStyle="#dff1fa";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(!mask[y][x]) continue;
      const v=grid[y][x];
      ctx.fillStyle=(v>=0?colors[v]:"#fff");
      ctx.fillRect(x*SCALE,y*SCALE,SCALE,SCALE);
      ctx.strokeStyle="#ffffff55";
      ctx.strokeRect(x*SCALE,y*SCALE,SCALE,SCALE);
    }
  }

  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(!mask[y][x]) continue;
    const n=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of n){
      const nx=x+dx,ny=y+dy;
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS||!mask[ny][nx]){
        ctx.fillStyle="#3b3b3b";
        if(dx===1)ctx.fillRect((x+1)*SCALE-2,y*SCALE,2,SCALE);
        if(dx===-1)ctx.fillRect(x*SCALE,y*SCALE,2,SCALE);
        if(dy===1)ctx.fillRect(x*SCALE,(y+1)*SCALE-2,SCALE,2);
        if(dy===-1)ctx.fillRect(x*SCALE,y*SCALE,SCALE,2);
      }
    }
  }
  updateStats();
}

function makePalette(){
  const p=document.getElementById("palette");
  p.innerHTML="";
  colors.forEach((c,i)=>{
    const card=document.createElement("div");
    card.className="colorCard";

    const sw=document.createElement("button");
    sw.type="button";
    sw.className="swatch"+(i===selected?" selected":"");
    sw.style.background=c;
    sw.onclick=()=>{selected=i;makePalette()};
    card.appendChild(sw);

    const pickerWrap=document.createElement("div");
    pickerWrap.style.position="relative";
    pickerWrap.style.height="30px";

    const picker=document.createElement("input");
    picker.type="color";
    picker.className="colorPicker";
    picker.value=c;
    picker.title="Farbe auswählen";
    picker.setAttribute("aria-label","Farbe auswählen");
    picker.style.height="30px";
    picker.oninput=()=>{
      colors[i]=picker.value;
      selected=i;
      makePalette();
      draw();
    };
    pickerWrap.appendChild(picker);

    const pickerText=document.createElement("span");
    pickerText.textContent="Farbe auswählen";
    pickerText.style.position="absolute";
    pickerText.style.inset="0";
    pickerText.style.display="flex";
    pickerText.style.alignItems="center";
    pickerText.style.justifyContent="center";
    pickerText.style.fontSize="12px";
    pickerText.style.fontWeight="600";
    pickerText.style.color="#222";
    pickerText.style.pointerEvents="none";
    pickerText.style.background="rgba(255,255,255,.45)";
    pickerText.style.borderRadius="6px";
    pickerWrap.appendChild(pickerText);

    card.appendChild(pickerWrap);

    const name=document.createElement("input");
    name.type="text";
    name.className="nameInput";
    name.maxLength=45;
    name.placeholder="Bedeutung dieser Farbe";
    name.value=colorNames[i];
    name.oninput=()=>{
      colorNames[i]=name.value;
      updateStats();
    };
    card.appendChild(name);

    p.appendChild(card);
  });
}

function escapeHtml(t){
  return t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function updateStats(){
  const counts=Array(colors.length).fill(0);
  const total=mask.flat().filter(Boolean).length;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(mask[y][x]&&grid[y][x]>=0)counts[grid[y][x]]++;
  }
  document.getElementById("stats").innerHTML="<strong>Flächenverteilung</strong>"+
    counts.map((n,i)=>{
      const name=colorNames[i].trim()||("Farbe "+(i+1));
      return '<div class="stat"><span>'+escapeHtml(name)+'</span><span>'+Math.round(n/total*100)+' %</span></div>';
    }).join("");
}

function dataURLtoBlob(dataurl) {
  const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){
    u8arr[n] = bstr.charCodeAt(n);
  }
  return new Blob([u8arr], {type:mime});
}

canvas.addEventListener("click",e=>{
  const r=canvas.getBoundingClientRect();
  const scaleX=canvas.width/r.width;
  const scaleY=canvas.height/r.height;
  const x=Math.floor(((e.clientX-r.left)*scaleX)/SCALE);
  const y=Math.floor(((e.clientY-r.top)*scaleY)/SCALE);
  if(x<0||x>=COLS||y<0||y>=ROWS||!mask[y][x])return;
  grid[y][x]=selected;
  draw();
});

document.getElementById("reset").onclick=()=>{
  if(confirm("Die Gestaltung wirklich zurücksetzen?")){
    grid=emptyGrid();
    colors=[...defaultColors];
    colorNames.fill("");
    setWorldURL(null);
    makePalette();
    draw();
  }
};

document.getElementById("save").onclick=()=>{
  const worlds = getSavedWorlds();
  const currentParam = getURLParam("world");
  let targetSlot = null;

  // Wenn bereits ein gültiger Slot geladen ist, wird genau dieser überschrieben
  if (currentParam && VALID_SLOTS.includes(currentParam)) {
    targetSlot = currentParam;
  } else {
    // Ansonsten den nächsten freien Slot aus [1, 2, 3] suchen
    const usedSlots = worlds.map(w => w.id);
    targetSlot = VALID_SLOTS.find(slot => !usedSlots.includes(slot));
  }

  if (!targetSlot) {
    alert("Maximale Anzahl von 3 Welten erreicht. Bitte lösche zuerst mindestens eine Welt.");
    return;
  }

  const expCanvas=document.createElement("canvas");
  const pad=24, headerH=30, rowH=26, rows=Math.ceil(colors.length/2);
  const legendH=pad+headerH+(rows*rowH)+pad;
  
  expCanvas.width=canvas.width;
  expCanvas.height=canvas.height+legendH;
  const exCtx=expCanvas.getContext("2d");
  
  exCtx.drawImage(canvas,0,0);
  
  exCtx.fillStyle="#ffffff";
  exCtx.fillRect(0,canvas.height,expCanvas.width,legendH);
  
  exCtx.strokeStyle="#222";
  exCtx.lineWidth=2;
  exCtx.strokeRect(0,canvas.height,expCanvas.width,legendH);
  
  exCtx.fillStyle="#222";
  exCtx.font="bold 16px system-ui, -apple-system, sans-serif";
  exCtx.fillText("Flächenverteilung & Legende",pad,canvas.height+pad+14);
  
  const counts=Array(colors.length).fill(0);
  const total=mask.flat().filter(Boolean).length;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(mask[y][x]&&grid[y][x]>=0)counts[grid[y][x]]++;
  }
  
  const colW=(expCanvas.width-(pad*3))/2;
  const startY=canvas.height+pad+headerH+12;
  
  exCtx.font="13px system-ui, -apple-system, sans-serif";
  
  colors.forEach((c,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const x=pad+col*(colW+pad);
    const y=startY+row*rowH;
    
    exCtx.fillStyle=c;
    exCtx.fillRect(x,y-11,14,14);
    exCtx.strokeStyle="#222";
    exCtx.lineWidth=1;
    exCtx.strokeRect(x,y-11,14,14);
    
    const name=colorNames[i].trim()||("Farbe "+(i+1));
    exCtx.fillStyle="#222";
    exCtx.textAlign="left";
    
    let dispName=name;
    if(exCtx.measureText(dispName).width>colW-70){
      while(dispName.length>0&&exCtx.measureText(dispName+"...").width>colW-70){
        dispName=dispName.slice(0,-1);
      }
      dispName+="...";
    }
    exCtx.fillText(dispName,x+20,y);
    
    const pct=Math.round(counts[i]/total*100)+" %";
    exCtx.textAlign="right";
    exCtx.fillText(pct,x+colW,y);
  });

  const dataUrl=expCanvas.toDataURL("image/png");
  const newWorld = {
    id: targetSlot,
    grid: JSON.parse(JSON.stringify(grid)),
    colors: [...colors],
    colorNames: [...colorNames],
    dataUrl: dataUrl
  };

  const updatedWorlds = worlds.filter(w => w.id !== targetSlot);
  updatedWorlds.push(newWorld);
  saveSavedWorlds(updatedWorlds);
  
  renderGallery();
  setWorldURL(targetSlot);

  const blob=dataURLtoBlob(dataUrl);
  const blobUrl=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.download="meine-fliegende-insel-welt-"+targetSlot+".png";
  a.href=blobUrl;
  a.click();
};

window.onpopstate = () => {
  const worldId = getURLParam('world');
  if (worldId && VALID_SLOTS.includes(worldId)) {
    const worlds = getSavedWorlds();
    const world = worlds.find(w => w.id === worldId);
    if (world) {
      loadWorldData(world);
      return;
    }
  }
  grid = emptyGrid();
  colors = [...defaultColors];
  colorNames.fill("");
  makePalette();
  draw();
};

renderGallery();
const initialWorldId = getURLParam('world');
if (initialWorldId && VALID_SLOTS.includes(initialWorldId)) {
  const worlds = getSavedWorlds();
  const world = worlds.find(w => w.id === initialWorldId);
  if (world) {
    loadWorldData(world);
  } else {
    makePalette();
    draw();
  }
} else {
  makePalette();
  draw();
}

})();
</script>
</body>
</html>
